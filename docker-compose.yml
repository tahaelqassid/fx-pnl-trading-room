services:
  postgres:
    image: postgres:16
    container_name: fx-pnl-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - fx_pnl_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  airflow-db:
    image: postgres:16
    container_name: fx-pnl-airflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - fx_pnl_airflow_meta:/var/lib/postgresql/data

  airflow:
    image: apache/airflow:2.9.3
    container_name: fx-pnl-airflow
    depends_on:
      - postgres
      - airflow-db
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      DBT_PROFILES_DIR: /opt/airflow/fx_pnl_dbt
      DBT_HOST: postgres
      DBT_PORT: "5432"
      _PIP_ADDITIONAL_REQUIREMENTS: "psycopg2-binary python-dotenv dbt-postgres"
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./engine:/opt/airflow/engine
      - ./fx_pnl_dbt:/opt/airflow/fx_pnl_dbt
      - .:/opt/airflow/project
    command: >
      bash -c "rm -f /opt/airflow/airflow-webserver.pid &&
      airflow db init &&
      airflow users create --username admin --password admin --firstname a --lastname b --role Admin --email a@a.com &&
      airflow standalone"

volumes:
  fx_pnl_data:
  fx_pnl_airflow_meta: